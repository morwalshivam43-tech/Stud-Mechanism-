{% extends "base.html" %}
{% block title %}Log in · Schoolbook{% endblock %}
{% block content %}
<div class="w-full max-w-sm">
  <h1 class="font-display text-3xl text-board mb-1">Log in</h1>
  <p class="text-sm text-slate-500 mb-6">Use the email you registered with.</p>
  <form method="post" class="space-y-4 bg-white p-6 rounded-lg border border-slate-200">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label class="block text-sm font-medium">Email
      <input type="email" name="email" value="{{ email }}" required autofocus class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-board">
    </label>
    <label class="block text-sm font-medium">Password
      <input type="password" name="password" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-board">
    </label>
    <button class="w-full bg-board text-white rounded-md py-2 font-medium hover:bg-emerald-900">Log in</button>
  </form>
  <p class="text-sm text-slate-500 mt-4">New here? <a class="text-board underline" href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
